name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Value
      description: Why does this matter?
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in/out of scope?
